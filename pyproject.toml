[project]
name = "ai-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "httpx>=0.27",
  "pydantic>=2.6", "pydantic-settings>=2.2", "dateparser>=1.2",
  "python-docx>=1.1", "openpyxl>=3.1", "holidays>=0.45", "python-dotenv>=1.0",
  "icalendar>=6", "recurring-ical-events>=3",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
